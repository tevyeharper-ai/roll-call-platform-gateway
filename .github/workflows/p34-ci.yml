name: Gateway P3.5 CI

on:
  push:
    branches:
      - development/p3.5-roll-call-shared-session
  pull_request:
    branches:
      - development/p3.4-roll-call-core-broadcast

permissions:
  contents: read

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: npm run check
      - name: Contract tests
        run: npm test
      - name: Docker build
        run: docker build -t roll-call-platform-gateway:p3.5 .
